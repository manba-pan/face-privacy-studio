name: 问题反馈
description: 报告启动、识别、预览或导出问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请勿上传私密视频、未经授权的人脸素材、付款记录或账号凭据。日志中的本地路径请先检查。"
  - type: input
    id: version
    attributes:
      label: 程序版本与 Windows 版本
      placeholder: "例如：影像工作台 0.3.1，Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
      description: 从导入素材开始描述操作，以及你期待的结果。
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 素材参数
      description: 分辨率、帧率、视频编码、音频编码、时长；不知道的可以留空。
  - type: textarea
    id: detail
    attributes:
      label: 错误提示或补充说明
      description: 可填写检查过的错误信息；不必提供原视频。
